[project]
name = "lunavi-back"
version = "0.1.0"
description = "LUNAVI pipeline and API: find and rank Earth analogs of Moon and Mars sites."
requires-python = ">=3.12,<3.14"
dependencies = [
    "certifi>=2024.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "rasterio>=1.4",
    "scipy>=1.14",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
